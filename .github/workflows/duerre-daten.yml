name: Dürremonitor aktualisieren

on:
  schedule:
    - cron: "40 10 * * *"   # täglich 10:40 UTC; der DWD stellt die Vortageswerte gegen 9 Uhr UTC bereit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: duerre-daten
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bodenfeuchte vom DWD laden und Seite erzeugen
        run: python scripts/duerre/build.py

      - name: Änderungen committen
        run: |
          if git diff --quiet -- duerre; then
            echo "Keine Änderungen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add duerre
          git commit -m "Dürremonitor aktualisieren ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
